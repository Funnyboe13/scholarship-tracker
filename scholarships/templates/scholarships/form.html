{% extends 'scholarships/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="card">
    <h2>{{ title }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Save</button>
        <a class="link-muted" href="{% url 'scholarship_list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
