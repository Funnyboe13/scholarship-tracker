<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Scholarship Tracker{% endblock %}</title>
    <style>
        :root {
            --primary: #0f766e;
            --primary-dark: #115e59;
            --bg: #f0f5f4;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --danger: #dc2626;
            --success: #15803d;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); }
        header { background: var(--primary); color: white; padding: 18px 24px; }
        header h1 { margin: 0; font-size: 22px; }
        header a { color: white; text-decoration: none; }
        main { max-width: 1000px; margin: 28px auto; padding: 0 16px; }
        .card { background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .top-bar h2 { margin: 0; }

        .head-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        nav a, nav span { color: white; margin-left: 14px; text-decoration: none; }
        form.inline { display: inline; margin-left: 14px; }
        .nav-btn { background: transparent; color: white; border: 1px solid white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .nav-btn:hover { background: rgba(255,255,255,0.15); }

        .btn { display: inline-block; padding: 10px 18px; border-radius: 8px; border: none; background: var(--primary); color: white; text-decoration: none; font-size: 15px; cursor: pointer; }
        .btn:hover { background: var(--primary-dark); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #b91c1c; }
        .link-muted { color: var(--muted); margin-left: 12px; text-decoration: none; }

        table { width: 100%; border-collapse: collapse; }
        th { background: var(--primary); color: white; text-align: left; padding: 12px; font-weight: 600; }
        th:first-child { border-top-left-radius: 8px; }
        th:last-child { border-top-right-radius: 8px; }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        tr:hover td { background: #f7fbfa; }
        .actions a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .actions a.delete { color: var(--danger); }

        .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
        .badge.not_started { background: #e5e7eb; color: #374151; }
        .badge.in_progress { background: #dbeafe; color: #1d4ed8; }
        .badge.submitted { background: #fef3c7; color: #b45309; }
        .badge.accepted { background: #dcfce7; color: #15803d; }
        .badge.rejected { background: #fee2e2; color: #b91c1c; }

        .filters { margin-bottom: 18px; }
        .chip { display: inline-block; padding: 6px 14px; margin: 0 6px 6px 0; border-radius: 999px; background: #e5e7eb; color: var(--text); text-decoration: none; font-size: 14px; }
        .chip.active { background: var(--primary); color: white; }
        tr.soon td { background: #fff7ed; }
        tr.overdue td { background: #fef2f2; }
        .tag-soon { color: #c2410c; font-weight: 600; }
        .tag-overdue { color: var(--danger); font-weight: 600; }

        .narrow { max-width: 440px; margin: 0 auto; }
        form p { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; }
        input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
        .errorlist { color: var(--danger); list-style: none; padding: 0; margin: 0 0 6px 0; }
        .helptext { color: var(--muted); font-size: 13px; display: block; }
        .helptext ul { padding-left: 18px; margin: 4px 0; }

        .toast-wrap { position: fixed; top: 80px; right: 20px; z-index: 1000; }
        .toast { background: white; border-left: 6px solid var(--primary); box-shadow: 0 6px 20px rgba(0,0,0,0.18); border-radius: 10px; padding: 14px 40px 14px 18px; margin-bottom: 10px; min-width: 240px; position: relative; font-weight: 600; animation: slidein 0.4s ease, fadeout 0.6s ease 4s forwards; }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        .toast-close { position: absolute; top: 6px; right: 10px; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted); width: auto; padding: 0; }
        @keyframes slidein { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeout { to { opacity: 0; transform: translateY(-10px); } }
    </style>
</head>
<body>
    <header>
        <div class="head-row">
            <h1><a href="{% url 'scholarship_list' %}">🎓 Scholarship Tracker</a></h1>
            <nav>
                {% if user.is_authenticated %}
                    <span>Hi, {{ user.username }}</span>
                    <form method="post" action="{% url 'logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="nav-btn">Log out</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Log in</a>
                    <a href="{% url 'signup' %}">Sign up</a>
                {% endif %}
            </nav>
        </div>
    </header>

    {% if messages %}
    <div class="toast-wrap">
        {% for message in messages %}
        <div class="toast {{ message.tags }}">
            {{ message }}
            <button type="button" class="toast-close" onclick="this.parentElement.remove()">&times;</button>
        </div>
        {% endfor %}
    </div>
    <script>
        setTimeout(function () {
            var wrap = document.querySelector('.toast-wrap');
            if (wrap) { wrap.remove(); }
        }, 4700);
    </script>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
