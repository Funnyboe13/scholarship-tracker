
{% extends 'scholarships/base.html' %}

{% block title %}Delete scholarship{% endblock %}

{% block content %}
<div class="card">
    <h2>Delete scholarship?</h2>
    <p>Are you sure you want to delete <strong>{{ scholarship.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Yes, delete</button>
        <a class="link-muted" href="{% url 'scholarship_list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
