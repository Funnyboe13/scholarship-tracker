<!DOCTYPE html>
<html>
<head>
    <title>Scholarship Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f4f4f4; }
    </style>
</head>
<body>
    <h1>My Scholarships</h1><p><a href="{% url 'scholarship_create' %}">+ Add scholarship</a></p>

    <table>
        <tr>
            <th>Name</th>
            <th>Country</th>
            <th>Deadline</th>
            <th>Coverage</th>
            <th>Status</th>
        </tr>
        {% for s in scholarships %}
        <tr>
            <td>{{ s.name }}</td>
            <td>{{ s.country }}</td>
            <td>{{ s.deadline }}</td>
            <td>{{ s.coverage }}</td>
            <td>{{ s.get_status_display }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="5">No scholarships yet.</td></tr>
        {% endfor %}
    </table>
</body>
</html>
